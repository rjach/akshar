name: Semantic PR title

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  title:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Types from docs/CONTRIBUTING.md
          types: |
            feat
            impr
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            revert
            chore
          requireScope: false

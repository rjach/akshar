name: Stale

on:
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v9
        with:
          days-before-stale: 60
          days-before-close: 14
          stale-issue-label: stale
          stale-pr-label: stale
          exempt-issue-labels: "pinned,security,confirmed"
          exempt-pr-labels: "pinned,security"
          stale-issue-message: "This issue has had no activity for 60 days. It will close in 14 days unless there is new activity."
          stale-pr-message: "This pull request has had no activity for 60 days. It will close in 14 days unless there is new activity."

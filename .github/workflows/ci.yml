name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format
        run: pnpm format-check
      - name: Lint and typecheck
        working-directory: frontend
        run: pnpm oxlint --type-aware --type-check --format github src __tests__ scripts vite-plugins vite.config.ts
      - name: Unit tests
        working-directory: frontend
        run: npx vitest run
      - name: Asset checks
        run: pnpm build-pkg && pnpm --filter @monkeytype/frontend check-assets
      - name: Production build (as on Vercel)
        run: bash frontend/scripts/vercel-build.sh

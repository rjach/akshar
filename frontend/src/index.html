<!doctype html>
<html lang="en">
  <head>
    <link
      rel="preload"
      href="/webfonts/RobotoMono-Regular.woff2"
      type="font/woff2"
      as="font"
      crossorigin
    />
    <link
      rel="preload"
      href="/webfonts/LexendDeca-Regular.woff2"
      type="font/woff2"
      as="font"
      crossorigin
    />

    <script>
      document.addEventListener("keydown", function (e) {
        if (e.key == "Escape") e.preventDefault();
      });
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Akshar (अक्षर) | Free Nepali Typing Test</title>
    <!-- fallback theme colors -->
    <style>
      :root {
        --bg-color: #323437;
        --main-color: #e2b714;
        --caret-color: #e2b714;
        --sub-color: #646669;
        --sub-alt-color: #2c2e31;
        --text-color: #d1d0c5;
        --error-color: #ca4754;
        --error-extra-color: #7e2a33;
        --colorful-error-color: #ca4754;
        --colorful-error-extra-color: #7e2a33;
        --nav-focus-opacity: 0;
      }
    </style>
    <!-- last configured theme colors (theme controller), applied before the
    first paint to avoid an initial flash of the default theme (and the body
    background fading from it) -->
    <script>
      try {
        var cachedTheme = localStorage.getItem("firstPaintThemeCss");
        if (cachedTheme) {
          var style = document.createElement("style");
          style.textContent = cachedTheme;
          document.head.appendChild(style);
        }
      } catch (e) {}
    </script>
    <link
      rel="icon"
      type="image/x-icon"
      sizes="32x32"
      href="/images/favicon/favicon.ico"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/images/favicon/apple-touch-icon.png"
    />
    <link
      rel="mask-icon"
      href="/images/favicon/safari-pinned-tab.svg"
      color="#eee"
    />
    <meta name="msapplication-TileColor" content="#e2b714" />
    <meta
      name="msapplication-config"
      content="/images/favicon/browserconfig.xml"
    />
    <meta
      name="description"
      content="A minimalistic Nepali typing test. Type Devanagari with the Nepali Unicode or Traditional keyboard from any keyboard, or switch to English. Free, no sign up."
    />
    <link rel="canonical" href="%SITE_URL%/" />
    <meta name="theme-color" content="#323437" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Akshar" />
    <meta property="og:locale" content="ne_NP" />
    <meta property="og:locale:alternate" content="en_US" />
    <meta
      property="og:title"
      content="Akshar (अक्षर) | Free Nepali Typing Test"
    />
    <meta
      property="og:description"
      content="A minimalistic Nepali typing test. Type Devanagari with the Nepali Unicode or Traditional keyboard from any keyboard, or switch to English. Free, no sign up."
    />
    <meta property="og:url" content="%SITE_URL%/" />
    <meta property="og:image" content="%SITE_URL%/images/mtsocial.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Akshar (अक्षर): A minimalistic Nepali typing test"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Akshar (अक्षर) | Free Nepali Typing Test"
    />
    <meta
      name="twitter:description"
      content="A minimalistic Nepali typing test. Type Devanagari with the Nepali Unicode or Traditional keyboard from any keyboard, or switch to English. Free, no sign up."
    />
    <meta name="twitter:image" content="%SITE_URL%/images/mtsocial.png" />
    <meta
      name="twitter:image:alt"
      content="Akshar (अक्षर): A minimalistic Nepali typing test"
    />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "@id": "%SITE_URL%/#website",
            "url": "%SITE_URL%/",
            "name": "Akshar",
            "alternateName": "अक्षर",
            "description": "A minimalistic Nepali typing test",
            "inLanguage": ["ne", "en"]
          },
          {
            "@type": "WebApplication",
            "@id": "%SITE_URL%/#app",
            "name": "Akshar",
            "alternateName": "अक्षर",
            "url": "%SITE_URL%/",
            "description": "A minimalistic Nepali typing test. Type Devanagari with the Nepali Unicode or Traditional keyboard from any keyboard, or switch to English.",
            "applicationCategory": "EducationalApplication",
            "operatingSystem": "Any",
            "browserRequirements": "Requires JavaScript",
            "isAccessibleForFree": true,
            "inLanguage": ["ne", "en"],
            "image": "%SITE_URL%/images/mtsocial.png",
            "offers": { "@type": "Offer", "price": "0", "priceCurrency": "NPR" }
          }
        ]
      }
    </script>
    <meta name="darkreader-lock" />
    <meta http-equiv="Cache-Control" content="no-store" />
    <style>
      /* 
      Layer order NEEDS to be here and one layer per line.
      This is because vite changes the order of the css imports,
      and the layer definition needs to be at the very very top, otherwise things break.
    */
      @layer normalize;
      @layer theme;
      @layer base;
      @layer components;
      @layer properties;
      @layer vendor;
      @layer custom-styles;
      @layer hidden;
      @layer utilities;
    </style>
    <link rel="stylesheet" class="testtesttest" href="styles/index.scss" />
    <link rel="stylesheet" class="testtest" href="styles/tailwind.css" />
    <link rel="stylesheet" class="test" href="styles/vendor.scss" />
  </head>

  <body class="loading">
    <!-- shown without js or css, so it can't be rendered by solid -->
    <load src="html/warnings.html" />
    <!-- renders the app after the markup above -->
    <script type="module" src="ts/index.tsx"></script>
  </body>
</html>
